[project]
name = "agentx"
version = "0.1.0"
description = "本地优先的个人助理桌面应用 (Electron + React + FastAPI + LangGraph)"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.2.0",
    "langgraph>=0.5.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "pymilvus>=2.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "tenacity>=9.0.0",
    "loguru>=0.7.0",
    "tavily-python>=0.5.0",
    "httpx>=0.27.0",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"
markers = [
    "integration: requires myserver connectivity, skipped in CI",
    "requires_myserver: requires myserver TEI/Milvus reachable",
]

[tool.ruff]
line-length = 100
target-version = "py311"
